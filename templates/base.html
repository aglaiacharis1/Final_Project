{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Random Movie Picker{% endblock title %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>
  <nav class="site-nav">
    <div class="site-nav__inner">
      <a class="brand" href="{% url 'home' %}">🎬 RandomMovie</a>
      <ul class="nav-links">
        <li><a href="{% url 'home' %}">Home</a></li>
        <li><a href="{% url 'about' %}">About</a></li>
      </ul>
      <div class="nav-actions">
        {% if user.is_authenticated %}
          <span class="nav-user">Hi, {{ user.username }}! 👋</span>
          <form action="{% url 'logout' %}" method="post" class="d-inline m-0">
            {% csrf_token %}
            <button type="submit" class="btn-pill btn-pill--outline">Log Out</button>
          </form>
        {% else %}
          <a class="btn-pill btn-pill--outline" href="{% url 'login' %}">Log In</a>
          <a class="btn-pill btn-pill--primary btn-pill--sm" href="{% url 'signup' %}">Sign Up</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="page-container">
    {% block content %}
    {% endblock content %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
