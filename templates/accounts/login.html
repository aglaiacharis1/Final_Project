{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Log In — Random Movie{% endblock title %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 bg-white p-4 rounded-3 shadow-sm">
    <h2>Log In</h2>
    <form method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <button type="submit" class="btn btn-success w-100">Log In</button>
    </form>
    <p class="mt-3">
        No account yet? <a href="{% url 'signup' %}">Sign up</a>
    </p>  
    </div>
</div>
{% endblock content %}
