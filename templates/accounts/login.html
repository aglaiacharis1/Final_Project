{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Log In — Random Movie{% endblock title %}

{% block content %}
<div class="ticket-card ticket-card--narrow">
  <span class="hero__eyebrow">Welcome back</span>
  <h2>Log In</h2>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn-pill btn-pill--primary btn-pill--full" style="margin-top: 1.5rem;">Log In</button>
  </form>
  <p class="auth-footer-link">
    No account yet? <a href="{% url 'signup' %}">Sign up</a>
  </p>
</div>
{% endblock content %}
