{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Sign Up — Random Movie{% endblock title %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 bg-white p-4 rounded-3 shadow-sm">
    <h2>Sign Up</h2>
    <form method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <button type="submit" class="btn btn-primary w-100">Register</button>
    </form>
  </div>
</div>
{% endblock content %}
