{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Sign Up — Random Movie{% endblock title %}

{% block content %}
<div class="ticket-card ticket-card--narrow">
  <span class="hero__eyebrow">Join the club</span>
  <h2>Sign Up</h2>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn-pill btn-pill--violet btn-pill--full" style="margin-top: 1.5rem;">Register</button>
  </form>
</div>
{% endblock content %}
